name: Build Windows VST3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target MENGIC_YEAT_BACKS_VST3 --parallel 2
      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: MENGIC-YEAT-BACKS-Windows-VST3
          path: build/MENGIC_YEAT_BACKS_artefacts/Release/VST3/*.vst3
          if-no-files-found: error
