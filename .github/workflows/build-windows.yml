name: Build Windows VST3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build VST3 and validation
        run: cmake --build build --config Release --target MENGIC_YEAT_BACKS_VST3 AlienDSPTests AlienValidation --parallel 2
      - name: Validate DSP and plugin
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package
          Copy-Item "build/MENGIC_YEAT_BACKS_artefacts/Release/VST3/MENGIC ALIEN.vst3" package -Recurse
          Copy-Item README_RU.md package
      - name: Upload Windows VST3
        uses: actions/upload-artifact@v4
        with:
          name: MENGIC-ALIEN-Windows-VST3
          path: package/
          if-no-files-found: error
      - name: Upload UI preview
        uses: actions/upload-artifact@v4
        with:
          name: MENGIC-ALIEN-UI
          path: build/MENGIC_ALIEN_UI.png
          if-no-files-found: error
